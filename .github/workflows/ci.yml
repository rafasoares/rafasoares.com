name: Lint and Typecheck

on: push

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          cache: true

      - name: Lint
        run: pnpm lint

      - name: Check for issues (Vite, Nuxt, Vue, etc.)
        run: pnpm check:doctor

      - name: Typecheck
        run: pnpm typecheck
